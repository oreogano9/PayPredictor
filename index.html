      function mergeCalendarShiftCollections(remoteShifts, localShifts) {
        const byId = new Map();
        [...(remoteShifts || []), ...(localShifts || [])].forEach((shift) => {
          if (!shift || !shift.date) return;
          const id = shift.id || [shift.kind || "work", shift.date, shift.startTime, shift.endTime].join("|");
          byId.set(id, shift);
        });

        const bySchedule = new Map();
        [...byId.values()].forEach((shift) => {
          const key = [shift.kind || "work", shift.date, shift.startTime, shift.endTime, shift.note || ""].join("|");
          bySchedule.set(key, shift);
        });
        return [...bySchedule.values()].sort((a, b) =>
          `${a.date} ${a.startTime || ""}`.localeCompare(`${b.date} ${b.startTime || ""}`),
        );
      }

        const hasLocalState = localStorage.getItem(STORAGE_KEY) !== null;
        const hasLocalSettings = localStorage.getItem(SETTINGS_STORAGE_KEY) !== null;
        const localState = readLocalState();
        const localSettings = readLocalSettings();
        const cloudState = cloudData?.appState || {};
        const cloudSettings = cloudData?.settings || {};

        const appState = hasLocalState
          ? {
              ...cloudState,
              ...localState,
              calendarShifts: mergeCalendarShiftCollections(
                cloudState.calendarShifts,
                localState.calendarShifts,
              ),
              monthlyVoucherOverrides: {
                ...(cloudState.monthlyVoucherOverrides || {}),
                ...(localState.monthlyVoucherOverrides || {}),
              },
            }
          : { ...readLocalState(), ...cloudState };
        const settings = hasLocalSettings
          ? { ...cloudSettings, ...localSettings }
          : { ...readLocalSettings(), ...cloudSettings };

        return { appState, settings };
      }

      function parseIcsDateValue(value) {
        if (!value) return null;
        if (/^\d{8}$/.test(value)) {
          const year = Number(value.slice(0, 4));
          const month = Number(value.slice(4, 6)) - 1;
          const day = Number(value.slice(6, 8));
          return new Date(year, month, day, 0, 0, 0, 0);
        }
        if (/^\d{8}T\d{6}Z$/.test(value)) {
          const year = Number(value.slice(0, 4));
          const month = Number(value.slice(4, 6)) - 1;
          const day = Number(value.slice(6, 8));
          const hour = Number(value.slice(9, 11));
          const minute = Number(value.slice(11, 13));
          const second = Number(value.slice(13, 15));
          return new Date(Date.UTC(year, month, day, hour, minute, second));
        }
        if (/^\d{8}T\d{6}$/.test(value)) {
          const year = Number(value.slice(0, 4));
          const month = Number(value.slice(4, 6)) - 1;
          const day = Number(value.slice(6, 8));
          const hour = Number(value.slice(9, 11));
          const minute = Number(value.slice(11, 13));
          const second = Number(value.slice(13, 15));
          return new Date(year, month, day, hour, minute, second);
        }
        return null;
      }

      function enumerateIcsDates(start, end, isAllDay) {
        if (!start) return [];
        const dates = [];
        const cursor = new Date(start.getFullYear(), start.getMonth(), start.getDate());
        const final = end
          ? new Date(end.getFullYear(), end.getMonth(), end.getDate())
          : new Date(cursor);

        if (!isAllDay && end && end.getTime() > final.getTime()) {
          final.setDate(final.getDate() + 1);
        }

        while (cursor < final || dates.length === 0) {
          dates.push(formatDateInput(cursor));
          cursor.setDate(cursor.getDate() + 1);
          if (dates.length > 366) break;
        }

        return dates;

      function formatImportTime(decimalHours) {
        const totalMinutes = Math.round(decimalHours * 60);
        const hours = Math.floor(totalMinutes / 60) % 24;
        const minutes = totalMinutes % 60;
        return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`;
      }

      function decodeShiftCode(code) {
        const duration = Number(code[0]);
        const slotIndex = Number(code.slice(1));
        const startHour = (4 + Math.floor((slotIndex - 1) / 2)) % 24;
        const startMinutes = ((slotIndex - 1) % 2) * 30;
        const startDecimal = startHour + startMinutes / 60;
        const endDecimal = (startDecimal + duration) % 24;
        return {
          duration,
          startTime: formatImportTime(startDecimal),
          endTime: formatImportTime(endDecimal),
        };
      }

      function normalizeImportLine(line) {
        return line
          .replace(/[–—]/g, "-")
          .replace(/\s+/g, " ")
          .trim();
      }

      function parseImportDate(line, fallbackYear) {
        const isoMatch = line.match(/\b(20\d{2})-(\d{1,2})-(\d{1,2})\b/);
        if (isoMatch) {
          return {
            date: new Date(Number(isoMatch[1]), Number(isoMatch[2]) - 1, Number(isoMatch[3])),
            matchedText: isoMatch[0],
          };
        }

        const textMatch = line.match(
          /\b(\d{1,2})\s+([A-Za-zÀ-ÿ]+)(?:\s+(\d{2}|\d{4}))?\b|\b([A-Za-zÀ-ÿ]+)\s+(\d{1,2})(?:\s+(\d{2}|\d{4}))?\b/i,
        );
        if (textMatch) {
          const monthToken = (textMatch[2] || textMatch[4] || "").toLowerCase();
          const month = IMPORT_MONTH_LOOKUP[monthToken];
          if (month !== undefined) {
            const day = Number(textMatch[1] || textMatch[5]);
            const yearToken = textMatch[3] || textMatch[6];
            const yearValue = yearToken
              ? Number(yearToken.length === 2 ? `20${yearToken}` : yearToken)
              : fallbackYear;

            return {
              date: new Date(yearValue, month, day),
              matchedText: textMatch[0],
            };
          }
        }

        const numericMatches = Array.from(
          line.matchAll(/\b(\d{1,2})[\/\-\.](\d{1,2})(?:[\/\-\.](\d{2}|\d{4}))?\b/g),
        );
        const numericMatch = numericMatches.find((match) => {
          const before = line[match.index - 1] || "";
          const after = line[match.index + match[0].length] || "";
          return before !== ":" && after !== ":" && Number(match[1]) >= 1 && Number(match[1]) <= 31 && Number(match[2]) >= 1 && Number(match[2]) <= 12;
        });

        if (numericMatch) {
          const day = Number(numericMatch[1]);
          const month = Number(numericMatch[2]) - 1;
          const yearValue = numericMatch[3]
            ? Number(numericMatch[3].length === 2 ? `20${numericMatch[3]}` : numericMatch[3])
            : fallbackYear;
          return {
            date: new Date(yearValue, month, day),
            matchedText: numericMatch[0],
          };
        }

        return null;
      }

      function parseImportedLine(line, fallbackYear) {
        const normalizedLine = normalizeImportLine(line);
        if (!normalizedLine) return null;

        const dateInfo = parseImportDate(normalizedLine, fallbackYear);
        if (!dateInfo || Number.isNaN(dateInfo.date.getTime())) return null;

        const lineWithoutDate = normalizedLine.replace(dateInfo.matchedText, "").trim();
        const freeMatch = lineWithoutDate.match(/\b(RIP|FNL|FR|FERIE|RIPOSO|MALATTIA|MUTUA|SICK|SICK LEAVE|SICK DAY)\b/i);
        const codeMatch = lineWithoutDate.match(/\b([4-8](?:0[1-9]|[1-3][0-9]|4[0-8]))\b/);
        const timeMatch = lineWithoutDate.match(/\b(\d{1,2})[:\.](\d{2})\s*(?:-|to)\s*(\d{1,2})[:\.](\d{2})\b/i);

        if (freeMatch) {
          const token = freeMatch[1].toUpperCase();
          if (isSickLeaveSummary(lineWithoutDate)) {
            return {
              kind: "sick",
              date: formatDateInput(dateInfo.date),
              allDay: true,
              summary: "Malattia",
              note: "Malattia",
            };
          }

          const summary =
            token === "RIP" || token === "RIPOSO"
              ? "Riposo"
              : token === "FR" || token === "FERIE"
                ? "Ferie"
                : "Da definire";
          return {
            kind: "free",
            date: formatDateInput(dateInfo.date),
            allDay: true,
            summary,
            note: summary,
          };
        }

        if (timeMatch) {
          const startTime = `${String(Number(timeMatch[1])).padStart(2, "0")}:${timeMatch[2]}`;
          const endTime = `${String(Number(timeMatch[3])).padStart(2, "0")}:${timeMatch[4]}`;
          const explicitNote = lineWithoutDate
            .replace(timeMatch[0], "")
            .replace(codeMatch?.[0] || "", "")
            .trim();
          const note = [codeMatch?.[1] || "", explicitNote].filter(Boolean).join(" ");
          return {
            kind: "work",
            date: formatDateInput(dateInfo.date),
            startTime,
            endTime,
            allDay: false,
            summary: codeMatch ? `Turno ${codeMatch[1]}` : "Turno lavoro",
            note: note || "Orario esplicito",
          };
        }

        if (codeMatch) {
          const code = codeMatch[1];
          const decoded = decodeShiftCode(code);
          return {
            kind: "work",
            date: formatDateInput(dateInfo.date),
            startTime: decoded.startTime,
            endTime: decoded.endTime,
            allDay: false,
            summary: `Turno ${code}`,
            note: code,
          };
        }

        return null;
      }

      function inferImportYear(text, fallbackYear) {
        const yearMatch = text.match(/\b(20\d{2})\b/);
        return yearMatch ? Number(yearMatch[1]) : fallbackYear;
      }

      function parseImportMatrixHeader(line, fallbackYear) {
        if (!/\bDipendenti\b/i.test(line)) return null;
        const dates = [];
        const dateMatches = line.matchAll(/\b(?:Lu|Ma|Me|Gi|Ve|Sa|Do)\.\s*(\d{1,2})\.(\d{1,2})\./gi);
        for (const match of dateMatches) {
          dates.push({
            day: Number(match[1]),
            month: Number(match[2]) - 1,
            year: fallbackYear,
          });
        }
        return dates.length > 0 ? dates : null;
      }

      function normalizePersonToken(value) {
        return String(value || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLocaleLowerCase("it-IT");

      function getPersonSearchTokens(value) {
        return normalizePersonToken(value)
          .split(/[^a-z0-9]+/i)
          .map((token) => token.trim())

      function personQueryMatches(employeeName, employeeId, personQuery) {
        const queryTokens = getPersonSearchTokens(personQuery);
        if (queryTokens.length === 0) return false;
        const id = normalizePersonToken(employeeId);
        const nameTokens = getPersonSearchTokens(employeeName);
        const textTokens = [...nameTokens, id].filter(Boolean);

        return queryTokens.every((queryToken) =>
          textTokens.some((token) => token === queryToken || token.startsWith(queryToken)),
        );
      }

      function parseImportedMatrixTextToEvents(text, fallbackYear, personQuery) {
        if (getPersonSearchTokens(personQuery).length === 0) return [];

        const lines = text.split("\n").map(normalizeImportLine).filter(Boolean);
        const headerIndex = lines.findIndex((line) => parseImportMatrixHeader(line, fallbackYear));
        if (headerIndex === -1) return [];

        const year = inferImportYear(text, fallbackYear);
        const dates = parseImportMatrixHeader(lines[headerIndex], year);
        if (!dates?.length) return [];

        const rowMatch = lines
          .slice(headerIndex + 1)
          .map((line) => line.match(/^(.+?)\s+(\d{5,})\s+(.+)$/))
          .find((match) => match && personQueryMatches(match[1], match[2], personQuery));
        if (!rowMatch) return [];

        const employeeName = rowMatch[1].trim();
        const employeeId = rowMatch[2].trim();
        const dayTokens = rowMatch[3].trim().split(/\s+/).slice(0, dates.length);

        return dayTokens
          .map((token, index) => {
            const dateInfo = dates[index];
            if (!dateInfo) return null;
            const date = formatDateInput(new Date(dateInfo.year, dateInfo.month, dateInfo.day));
            const normalizedToken = token.toUpperCase();

            if (/^[4-8](?:0[1-9]|[1-3][0-9]|4[0-8])$/.test(normalizedToken)) {
              const decoded = decodeShiftCode(normalizedToken);
              return {
                id: `matrix-${employeeId}-${date}-${index}`,
                kind: "work",
                date,
                startTime: decoded.startTime,
                endTime: decoded.endTime,
                allDay: false,
                summary: `Turno ${normalizedToken}`,
                note: normalizedToken,
                employeeName,
              };
            }

            const summary =
              normalizedToken === "RIP"
                ? "Riposo"
                : normalizedToken === "FR"
                  ? "Ferie"
                  : normalizedToken === "FNL"
                    ? "Da definire"
                    : normalizedToken === "OF"
                      ? "Fuori turno"
                      : normalizedToken;

            return {
              id: `matrix-${employeeId}-${date}-${index}`,
              kind: "free",
              date,
              allDay: true,
              summary,
              note: normalizedToken,
              employeeName,
            };
          })
          .filter(Boolean);
      }

      function expandImportedLines(text, fallbackYear) {
        const lines = text.split("\n");
        const expanded = [];
        let lastDate = null;

        for (const rawLine of lines) {
          const normalizedLine = normalizeImportLine(rawLine);
          if (!normalizedLine) {
            expanded.push(rawLine);
            continue;
          }

          const parsed = parseImportedLine(normalizedLine, fallbackYear);
          if (parsed?.date) {
            const currentDate = new Date(`${parsed.date}T00:00:00`);
            if (lastDate) {
              const diffDays = Math.round((currentDate.getTime() - lastDate.getTime()) / 86400000);
              if (diffDays > 1 && diffDays <= 20) {
                for (let i = 1; i < diffDays; i += 1) {
                  const missingDate = new Date(lastDate);
                  missingDate.setDate(missingDate.getDate() + i);
                  expanded.push(`${formatDateInput(missingDate)} RIP`);
                }
              }
            }
            lastDate = currentDate;
          }

          expanded.push(rawLine);
        }

        return expanded;
      }

      function parseImportedTextToEvents(text, fallbackYear, personQuery = "") {
        const matrixEvents = parseImportedMatrixTextToEvents(text, fallbackYear, personQuery);
        if (matrixEvents.length > 0) return matrixEvents;

        return expandImportedLines(text, fallbackYear)
          .map((line, index) => {
            const parsed = parseImportedLine(line, fallbackYear);
            if (!parsed) return null;
            return {
              id: `extracted-${parsed.date}-${index}`,
              ...parsed,
            };
          })
          .filter(Boolean);
      }

      function buildGoogleCalendarCsv(events) {
        const rows = [["Subject", "Start Date", "Start Time", "End Date", "End Time", "All Day Event", "Description"]];
        const csvDate = (dateValue) => {
          const date = new Date(`${dateValue}T00:00:00`);
          return `${String(date.getMonth() + 1).padStart(2, "0")}/${String(date.getDate()).padStart(2, "0")}/${date.getFullYear()}`;
        };

        events.forEach((event) => {
          if (event.allDay) {
            rows.push([event.summary, csvDate(event.date), "", csvDate(event.date), "", "True", event.note || ""]);
            return;
          }

          const start = buildDateTime(event.date, event.startTime);
          let end = buildDateTime(event.date, event.endTime);
          if (end <= start) end = new Date(end.getTime() + 24 * 3600000);
          rows.push([
            event.summary,
            csvDate(event.date),
            event.startTime,
            csvDate(formatDateInput(end)),
            event.endTime,
            "False",
            event.note || "",
          ]);
        });

        return rows
          .map((row) =>
            row
              .map((value) => `"${String(value ?? "").replace(/"/g, '""')}"`)
              .join(","),
          )
          .join("\n");
      }

      async function ensurePdfJs() {
        if (window.pdfjsLib) return window.pdfjsLib;
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js";
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
        return window.pdfjsLib;
      }

      async function extractPdfLines(file) {
        const pdfjsLib = await ensurePdfJs();
        const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
        const pages = [];

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
          const page = await pdf.getPage(pageNumber);
          const textContent = await page.getTextContent();
          const lines = [];

          textContent.items.forEach((item) => {
            const x = item.transform[4];
            const y = item.transform[5];
            const text = normalizeImportLine(item.str);
            if (!text) return;

            let line = lines.find((entry) => Math.abs(entry.y - y) < 2.5);
            if (!line) {
              line = { y, parts: [] };
              lines.push(line);
            }
            line.parts.push({ x, text });
          });

          lines
            .sort((left, right) => right.y - left.y)
            .forEach((line) => {
              const joined = line.parts
                .sort((left, right) => left.x - right.x)
                .map((part) => part.text)
                .join(" ")
                .replace(/\s+/g, " ")
                .trim();
              if (joined) pages.push(joined);
            });
        }

        return pages.join("\n");
      }

      function isMidnightToMidnightCalendarBlock(start, end) {
        if (!start || !end || end <= start) return false;
        const startsAtMidnight =
          start.getHours() === 0 &&
          start.getMinutes() === 0 &&
          start.getSeconds() === 0;
        const endsAtMidnight =
          end.getHours() === 0 &&
          end.getMinutes() === 0 &&
          end.getSeconds() === 0;
        return startsAtMidnight && endsAtMidnight;
      }

      function parsePublicIcsToShifts(icsText) {
        const unfolded = unfoldIcsLines(icsText);
        const events = unfolded.split("BEGIN:VEVENT").slice(1);
        const shifts = [];

        events.forEach((eventText, index) => {
          const dtStartValue = getIcsField(eventText, "DTSTART");
          const dtEndValue = getIcsField(eventText, "DTEND");
          const summary = decodeIcsText(getIcsField(eventText, "SUMMARY"));
          const uid = decodeIcsText(getIcsField(eventText, "UID"));
          const recurrenceId = getIcsField(eventText, "RECURRENCE-ID");
          const status = getIcsField(eventText, "STATUS").toUpperCase();
          const isAllDay = /DTSTART;VALUE=DATE/i.test(eventText) || /DTEND;VALUE=DATE/i.test(eventText);
          const start = parseIcsDateValue(dtStartValue);
          const end = parseIcsDateValue(dtEndValue);
          const isSickLeave = isSickLeaveSummary(summary);
          const isPaidLeave = isPaidLeaveSummary(summary);
          const eventIdentity = encodeURIComponent(
            [uid || `event-${index}`, recurrenceId || dtStartValue].filter(Boolean).join("|"),
          );

          if (status === "CANCELLED" || !dtStartValue || (!dtEndValue && !isSickLeave && !isPaidLeave)) {
            return;
          }

          if (isSickLeave) {
            const sickDates = enumerateIcsDates(start, end, isAllDay);
            sickDates.forEach((dateValue, sickIndex) => {
              shifts.push({
                id: `ical-sick-${eventIdentity}-${dateValue}-${sickIndex}`,
                legacyId: `ical-sick-${dateValue}-${index}-${sickIndex}`,
                date: dateValue,
                startTime: "00:00",
                endTime: "00:00",
                source: "ical",
                kind: "sick",
                note: "Malattia",
              });
            });
            return;
          }

          if (isPaidLeave) {
            const leaveDates = enumerateIcsDates(start, end, isAllDay);
            leaveDates.forEach((dateValue, leaveIndex) => {
              shifts.push({
                id: `ical-leave-${eventIdentity}-${dateValue}-${leaveIndex}`,
                legacyId: `ical-leave-${dateValue}-${index}-${leaveIndex}`,
                date: dateValue,
                startTime: "00:00",
                endTime: "00:00",
                source: "ical",
                kind: "leave",
                note: "Ferie",
              });
            });
            return;
          }

          if (
            isAllDay ||
            !start ||
            !end ||
            end <= start ||
            isMidnightToMidnightCalendarBlock(start, end)
          ) {
            return;
          }

          shifts.push({
            id: `ical-${eventIdentity}`,
            legacyId: `ical-${formatDateInput(start)}-${formatTimeInput(start)}-${index}`,
            date: formatDateInput(start),
            startTime: formatTimeInput(start),
            endTime: formatTimeInput(end),
            source: "ical",
          });
        });

        return shifts;
      }

      function roundToHalfHour(date) {
        const rounded = new Date(date);
        rounded.setMinutes(Math.round(rounded.getMinutes() / 30) * 30);
        rounded.setSeconds(0);
        rounded.setMilliseconds(0);
        return rounded;
      }

      function formatDateInput(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(
          date.getDate(),
        ).padStart(2, "0")}`;
      }

      function formatMonthInput(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
      }

      function formatTimeInput(date) {
        return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
      }

      function buildDateTime(dateValue, timeValue) {
        const [year, month, day] = dateValue.split("-").map(Number);
        const [hours, minutes] = timeValue.split(":").map(Number);
        return new Date(year, month - 1, day, hours, minutes, 0, 0);
      }

        useEffect(() => {

          () => {
            const deduped = new Map();

            const overriddenImportedIds = new Set(
              localShifts.map((shift) => shift.originalId).filter(Boolean),

            [
              ...importedCalendarShifts.filter(

                  !overriddenImportedIds.has(shift.id) &&
                  !overriddenImportedIds.has(shift.legacyId),
              ),

            ].forEach((shift) => {
              const key = [
                shift.kind || "work",
                shift.date,
                shift.startTime,
                shift.endTime,
              ].join("|");
              deduped.set(key, shift);
            });
            return [...deduped.values()].sort((a, b) =>
              `${a.date} ${a.startTime}`.localeCompare(`${b.date} ${b.startTime}`),
            );
          },
          [calendarShifts, importedCalendarShifts],
        );
        const absenceKindByDate = useMemo(() => {
          const next = new Map();
          allCalendarShifts.forEach((shift) => {
            if (isLeaveShift(shift) && !next.has(shift.date)) {
              next.set(shift.date, "leave");
            }
            if (isSickShift(shift)) {
              next.set(shift.date, "sick");

          });

        }, [allCalendarShifts]);

              ),

              ),
            ].sort((a, b) =>
              `${a.date} ${a.startTime}`.localeCompare(`${b.date} ${b.startTime}`),
            ),
          [absenceKindByDate, allCalendarShifts],
        );

        const calculateStoredDayPrefill = React.useCallback(
          (dateValue, cutoffMs, baseWeeklyHours = 0) => {

              .filter((shift) => shift.date === dateValue)
              .sort((a, b) => a.startTime.localeCompare(b.startTime));

            let aggregate = createEmptyBreakdown();
            let paidHoursBefore = 0;

            for (const shift of dayShifts) {
              const { start, end } = getShiftRange(shift.date, shift.startTime, shift.endTime);
              if (end.getTime() > cutoffMs) {
                continue;
              }
              const breakdown = calculateDailyShiftBreakdown(
                shift,
                dayShifts,
                baseWeeklyHours + paidHoursBefore,
                baseWeeklyHours + paidHoursBefore,
              );
              aggregate = mergeBreakdowns(aggregate, breakdown);
              paidHoursBefore += breakdown.paidElapsed / 3600000;
            }

          },

        );

        const saveState = async (nextState) => {
          if (!user) return;

          writeLocalState(completeState);
          queueCloudBackup(completeState, readLocalSettings());

          if (isLocalMode) {

          }

          const userDocRef = services.db
            .collection("artifacts")
            .doc(appId)
            .collection("users")
            .doc(user.uid)
            .collection("settings")
            .doc("main");

          await userDocRef.set(nextState, { merge: true });

        const isNightShift = (date) => {
          const hours = date.getHours();

        const isSunday = (date) => date.getDay() === 0;

        const getHoliday = (date) => {
          const monthDay = `${String(date.getMonth() + 1).padStart(2, "0")}-${String(
            date.getDate(),
          ).padStart(2, "0")}`;
          return ITALIAN_HOLIDAYS[monthDay] || ITALIAN_HOLIDAYS[`${date.getFullYear()}-${monthDay}`] || null;
        };

        const isSundayOrHoliday = (date) => isSunday(date) || Boolean(getHoliday(date));

        const getPayCode = (payCode) => PAY_CODES[payCode] || PAY_CODES.ORD;

        const getAutomaticPayCode = (
          date,
          cumulativeRegularScopeHours,
          cumulativeWeeklyHours = cumulativeRegularScopeHours,
          regularThreshold = WEEKLY_GOAL_HOURS,
        ) => {
          if (cumulativeWeeklyHours + HOURS_EPSILON >= FULL_TIME_WEEKLY_HOURS) {
            return isNightShift(date) ? "S45" : "S25";
          }
          if (cumulativeRegularScopeHours + HOURS_EPSILON >= regularThreshold) {
            return isNightShift(date) && !isSundayOrHoliday(date) ? "S50" : "S15";
          }

        const calculateBreakdown = (
          startMs,
          endMs,
          regularScopeHoursBefore = 0,
          weeklyHoursBefore = regularScopeHoursBefore,
          regularThreshold = WEEKLY_GOAL_HOURS,
          unpaidBreakOverrideMs = null,
        ) => {
          let base = 0;
          let nightWeekdayExtra = 0;
          let nightSundayHolidayExtra = 0;
          let nightWeekdayHours = 0;
          let nightSundayHolidayHours = 0;
          let clockNightWeekdayHours = 0;
          let clockNightSundayHolidayHours = 0;
          const payCodeTotals = {
            ORD: 0,
            S15: 0,
            S25: 0,
            S45: 0,
            S50: 0,
          };
          const step = 60000;
          const elapsed = endMs - startMs;
          const unpaidBreakMs =
            unpaidBreakOverrideMs === null
              ? elapsed >= UNPAID_BREAK_THRESHOLD
                ? UNPAID_BREAK_DURATION
                : 0
              : Math.max(0, Math.min(elapsed, unpaidBreakOverrideMs));
          const breakEndMs = unpaidBreakMs > 0 ? startMs + elapsed / 2 : null;
          const breakStartMs = breakEndMs === null ? null : breakEndMs - unpaidBreakMs;
          const payableDurationHours = Math.max(0, elapsed - unpaidBreakMs) / 3600000;
          const weeklyRegularHoursForShift = Math.min(
            payableDurationHours,
            Math.max(0, FULL_TIME_WEEKLY_HOURS - weeklyHoursBefore),
          );
          let paidHoursSoFar = 0;
          let regularScopeHoursSoFar = 0;
          let curr = startMs;

            const next = Math.min(curr + step, endMs);
            const d = new Date(curr);
            // Clock-time night totals stay independent from premium-eligible NTT/NTD hours.
            if (isNightShift(d)) {

              if (isSundayOrHoliday(d)) {
                clockNightSundayHolidayHours += clockHours;

              }

            const breakOverlapMs =

            const paidStepMs = next - curr - breakOverlapMs;
            if (paidStepMs <= 0) {
              curr = next;
              continue;
            }

            const hours = paidStepMs / 3600000;
            const isAllocatedWeeklyOvertime =
              paidHoursSoFar + HOURS_EPSILON >= weeklyRegularHoursForShift;
            const payCode = isAllocatedWeeklyOvertime
              ? isNightShift(d)
                ? "S45"
                : "S25"
              : regularScopeHoursBefore + regularScopeHoursSoFar + HOURS_EPSILON >= regularThreshold
                ? isNightShift(d) && !isSundayOrHoliday(d)
                  ? "S50"
                  : "S15"
                : "ORD";
            const payCodeDetails = getPayCode(payCode);
            payCodeTotals[payCode] += hours;
            base += hours * payRates.baseRate * payCodeDetails.multiplier;
            if (payCode === "ORD") {
              regularScopeHoursSoFar += hours;
            }
            if (isNightShift(d) && payCode === "S45") {

            } else if (isNightShift(d) && isSundayOrHoliday(d)) {

              nightSundayHolidayHours += hours;
            } else if (isNightShift(d) && payCode !== "S50") {
              nightWeekdayExtra += hours * (payRates.baseRate * NIGHT_WEEKDAY_BONUS_FRACTION);
              nightWeekdayHours += hours;
            }
            paidHoursSoFar += hours;
            curr = next;
          }

          const total = base + nightExtra;

            total,
            base,
            payCodeTotals,
            nightExtra,
            nightWeekdayExtra,
            nightSundayHolidayExtra,
            nightWeekdayHours,
            nightSundayHolidayHours,
            clockNightWeekdayHours,
            clockNightSundayHolidayHours,
            mealVoucher,
            elapsed,
            paidElapsed,
            unpaidBreakMs,
            leaveHours: 0,

        const calculatePayslipNetEstimate = ({
          payCodeTotals,

          leaveDays,

          if (workedDays === 0 && leaveDays === 0 && holidayRestDays === 0) {

              irpefTaxable: 0,

          const regularPay = payRates.monthlyBase;
          const s15Pay = roundCurrency(payCodeTotals.S15 * payRates.s15Rate);
          const s50Pay = roundCurrency(payCodeTotals.S50 * payRates.s50Rate);
          const s25Pay = roundCurrency(payCodeTotals.S25 * payRates.s25Rate);
          const s45Pay = roundCurrency(payCodeTotals.S45 * payRates.s45Rate);
          const nttPay = roundCurrency(nightWeekdayHours * payRates.nttRate);
          const ntdPay = roundCurrency(nightSundayHolidayHours * payRates.ntdRate);
          const shiftAllowance = roundCurrency(workedDays * payRates.shiftAllowanceRate);
          const dailyTurnistaAllowance = roundCurrency(workedDays * payRates.dailyTurnistaRate);
          const campoAllowance = roundCurrency(workedDays * payRates.campoRate);
          const holidayRestPay = roundCurrency(holidayRestDays * payRates.holidayRestRate);
          const leaveAllowance = roundCurrency(leaveDays * payRates.leaveDayAllowanceRate);
          const variablePay = roundCurrency(
            shiftAllowance +
              dailyTurnistaAllowance +
              campoAllowance +
              holidayRestPay +
              leaveAllowance +
              s15Pay +
              s50Pay +
              s25Pay +
              s45Pay +
              nttPay +
              ntdPay,
          );
          const grossPayroll = roundCurrency(regularPay + variablePay);
          const contributionBase = Math.floor(grossPayroll);
          const fondoTrasporto = roundCurrency(contributionBase * PAYSLIP_FONDO_TRASPORTO_RATE);
          const ivs = roundCurrency(contributionBase * PAYSLIP_IVS_RATE);
          const fis = roundCurrency(contributionBase * PAYSLIP_FIS_RATE);
          const cigs = roundCurrency(contributionBase * PAYSLIP_CIGS_RATE);
          const unionDues = unionDuesEnabled ? roundCurrency(payRates.monthlyBase * PAYSLIP_UNION_DUES_RATE) : 0;
          const substituteTaxable = roundCurrency(variablePay * PAYSLIP_SUBSTITUTE_TAXABLE_VARIABLE_FRACTION);
          const substituteTax = roundCurrency(substituteTaxable * PAYSLIP_SUBSTITUTE_TAX_RATE);
          const irpefTaxable = roundCurrency(grossPayroll - fondoTrasporto - ivs - fis - cigs - substituteTaxable);
          const irpefGross = roundCurrency(irpefTaxable * PAYSLIP_IRPEF_RATE);
          const irpefWithheld = Math.max(0, roundCurrency(irpefGross - PAYSLIP_EMPLOYEE_DEDUCTION));
          const l207Indemnity = roundCurrency(irpefTaxable * PAYSLIP_L207_INDEMNITY_RATE);
          const totalCredits = roundCurrency(PAYSLIP_TRATTAMENTO_INTEGRATIVO + l207Indemnity);
          const totalDeductions = roundCurrency(
            parkingDeduction + unionDues + fondoTrasporto + ivs + fis + cigs + substituteTax + irpefWithheld,
          );
          const net = roundCurrency(grossPayroll + totalCredits - totalDeductions + PAYSLIP_ROUNDING);

          return {
            net,
            grossPayroll,
            regularPay,
            variablePay,
            s15Pay,
            s25Pay,
            s45Pay,
            s50Pay,
            nttPay,
            ntdPay,
            holidayRestPay,
            leaveAllowance,
            totalCredits,
            totalDeductions,
            irpefTaxable,
            substituteTaxable,
            irpefWithheld,
            substituteTax,
            unionDues,
            l207Indemnity,
            socialContributions: roundCurrency(fondoTrasporto + ivs + fis + cigs),
          };
        };

        const getSessionAutoEnd = (startMs, timeValue) => {
          if (!timeValue) return null;

        const getShiftRange = (dateValue, startValue, endValue) => {
          const start = buildDateTime(dateValue, startValue);
          let end = buildDateTime(dateValue, endValue);
          if (end <= start) end = new Date(end.getTime() + 24 * 3600000);
          return { start, end };

        const calculateShiftBreakdown = (
          shift,
          regularScopeHoursBefore = 0,
          weeklyHoursBefore = regularScopeHoursBefore,
          regularThreshold = WEEKLY_GOAL_HOURS,
          unpaidBreakOverrideMs = null,
        ) => {
          const { start, end } = getShiftRange(shift.date, shift.startTime, shift.endTime);
          if (isAbsenceShift(shift)) {
            const elapsed = end.getTime() - start.getTime();
            const hours = elapsed / 3600000;
            return {
              ...createEmptyBreakdown(),
              total: hours * payRates.baseRate,
              base: hours * payRates.baseRate,
              elapsed,
              paidElapsed: elapsed,
              leaveHours: isLeaveShift(shift) ? hours : 0,
              sickHours: isSickShift(shift) ? hours : 0,
            };
          }
          return calculateBreakdown(
            start.getTime(),
            end.getTime(),
            regularScopeHoursBefore,
            weeklyHoursBefore,
            regularThreshold,
            unpaidBreakOverrideMs,
          );
        };

        const calculateDailyShiftBreakdown = (
          shift,
          dayShifts,
          regularScopeHoursBefore = 0,
          weeklyHoursBefore = regularScopeHoursBefore,
          regularThreshold = WEEKLY_GOAL_HOURS,
        ) => {
          if (isAbsenceShift(shift)) {
            return calculateShiftBreakdown(
              shift,
              regularScopeHoursBefore,
              weeklyHoursBefore,
              regularThreshold,
            );
          }

          const workedShifts = dayShifts
            .filter((candidate) => !isAbsenceShift(candidate))
            .sort((left, right) => left.startTime.localeCompare(right.startTime));
          const workedDurations = workedShifts.map((candidate) => {
            const range = getShiftRange(candidate.date, candidate.startTime, candidate.endTime);
            return { shift: candidate, elapsed: range.end.getTime() - range.start.getTime() };
          });
          const workedElapsed = workedDurations.reduce((total, entry) => total + entry.elapsed, 0);
          const voucherOwner = workedShifts[0];
          const breakOwner = workedDurations.reduce(
            (longest, entry) => (!longest || entry.elapsed > longest.elapsed ? entry : longest),
            null,
          )?.shift;
          const isSameShift = (candidate) =>
            candidate === shift ||
            (candidate?.id && shift.id && candidate.id === shift.id);
          const isVoucherOwner =
            workedElapsed >= MEAL_VOUCHER_THRESHOLD && isSameShift(voucherOwner);
          const unpaidBreakMs =
            workedElapsed >= UNPAID_BREAK_THRESHOLD && isSameShift(breakOwner)
              ? UNPAID_BREAK_DURATION
              : 0;
          const breakdown = calculateShiftBreakdown(
            shift,
            regularScopeHoursBefore,
            weeklyHoursBefore,
            regularThreshold,
            unpaidBreakMs,
          );

          return {
            ...breakdown,
            mealVoucher: isVoucherOwner ? MEAL_VOUCHER_AMOUNT : 0,
          };
        };

                  </details>
                </section>
              )}
              {previewCalendarDay && (
                <div className="fixed inset-0 z-50 flex items-stretch justify-center bg-black/85 p-3 backdrop-blur sm:p-6">
                  <section className="flex w-full max-w-3xl flex-col overflow-hidden rounded border border-white/10 bg-zinc-950 shadow-2xl">
                    <div className="flex items-start justify-between gap-4 border-b border-white/10 p-4">
                      <div>
                        <p className="text-[10px] font-black uppercase tracking-widest text-zinc-500">
                          Anteprima giorno
                        </p>
                        <h3 className="mt-2 text-2xl font-black text-white">
                          {previewCalendarDay.date.toLocaleDateString("it-IT", {
                            weekday: "long",
                            day: "2-digit",
                            month: "long",
                            year: "numeric",
                          })}
                        </h3>
                      </div>
                      <button
                        type="button"
                        onClick={closeCalendarDayPreview}
                        className="rounded border border-white/10 px-3 py-2 text-[10px] font-black uppercase tracking-widest text-zinc-300 hover:text-white"
                      >
                        Chiudi
                      </button>
                    </div>

                    <div className="overflow-y-auto p-4">
                      {previewCalendarDay.shifts.length === 0 ? (
                        <p className="py-10 text-center text-sm font-bold text-zinc-500">
                          Nessun turno salvato per questo giorno.
                        </p>
                      ) : (
                        <div className="space-y-4">
                          <div className="grid grid-cols-2 gap-2 sm:grid-cols-4">
                            <div className="summary-card summary-earnings rounded p-3">
                              <p className="text-[9px] font-black uppercase tracking-widest summary-label">
                                Totale
                              </p>
                              <p className="mt-2 text-lg font-black summary-value">
                                EUR {previewDayData.totalWithVoucher.toFixed(2)}
                              </p>
                            </div>
                            <div className="rounded border border-white/10 bg-white/[0.04] p-3">
                              <p className="text-[9px] font-black uppercase tracking-widest text-zinc-500">
                                Ore pagate
                              </p>
                              <p className="mt-2 text-lg font-black text-white">
                                {(previewDayData.aggregate.paidElapsed / 3600000).toFixed(2)}h
                              </p>
                            </div>
                            <div className="summary-card summary-night rounded p-3">
                              <p className="text-[9px] font-black uppercase tracking-widest summary-label">
                                Ore notte
                              </p>
                              <p className="mt-2 text-lg font-black summary-value">
                                {getTotalNightHours(previewDayData.aggregate).toFixed(2)}h
                              </p>
                            </div>
                            <div className="summary-card summary-voucher rounded p-3">
                              <p className="text-[9px] font-black uppercase tracking-widest summary-label">
                                Buoni
                              </p>
                              <p className="mt-2 text-lg font-black summary-value">
                                EUR {previewDayData.aggregate.mealVoucher.toFixed(2)}
                              </p>
                            </div>
                          </div>

                          <div className="flex flex-wrap gap-2">
                            {Object.entries(previewDayData.payCodeTotals)
                              .filter(([, hours]) => hours > 0)
                              .map(([code, hours]) => (
                                <span
                                  key={code}
                                  className="rounded border border-white/10 bg-white/[0.04] px-2 py-1 text-[9px] font-black uppercase tracking-tight text-zinc-300"
                                >
                                  {getPayCode(code).label}: {hours.toFixed(2)}h
                                </span>
                              ))}
                            {previewDayData.aggregate.nightWeekdayExtra > 0 && (
                              <span className="rounded border border-white/10 bg-white/[0.04] px-2 py-1 text-[9px] font-black uppercase tracking-tight text-zinc-300">
                                NTT: +EUR {previewDayData.aggregate.nightWeekdayExtra.toFixed(2)}
                              </span>
                            )}
                            {previewDayData.aggregate.nightSundayHolidayExtra > 0 && (
                              <span className="rounded border border-white/10 bg-white/[0.04] px-2 py-1 text-[9px] font-black uppercase tracking-tight text-zinc-300">
                                NTD: +EUR {previewDayData.aggregate.nightSundayHolidayExtra.toFixed(2)}
                              </span>
                            )}
                            {previewDayData.aggregate.unpaidBreakMs > 0 && (
                              <span className="rounded border border-red-400/15 bg-red-500/[0.06] px-2 py-1 text-[9px] font-black uppercase tracking-tight text-red-200/80">
                                Pausa pranzo: -{previewDayData.aggregate.unpaidBreakMs / 60000} min
                              </span>
                            )}
                          </div>

                          <div className="space-y-2">
                            {previewDayData.entries.map(({ shift, breakdown, totalWithVoucher }) => {
                              const isSick = isSickShift(shift);
                              const isLeave = isLeaveShift(shift);
                              const isAbsence = isSick || isLeave;
                              const isOvernight = !isAbsence && shift.endTime <= shift.startTime;
                              const nightHours = getTotalNightHours(breakdown);
                              return (
                                <div key={shift.id} className="rounded border border-white/10 bg-white/[0.035] p-3">
                                  <div className="flex items-start justify-between gap-3">
                                    <div>
                                      <div className="flex flex-wrap items-center gap-2 text-sm font-black text-white">
                                        {isSick && renderSickIcon("h-5 w-5")}
                                        {isLeave && renderLeaveIcon("h-5 w-5")}
                                        <span>{isSick ? "Malattia" : isLeave ? "Ferie" : `${shift.startTime}-${shift.endTime}`}</span>
                                        {isOvernight && (
                                          <span className="rounded border border-violet-300/25 bg-violet-500/10 px-2 py-0.5 text-[9px] font-black uppercase tracking-widest text-violet-200">
                                            Conta sul giorno di inizio
                                          </span>
                                        )}
                                      </div>
                                      <div className="mt-2 flex flex-wrap gap-2 text-[10px] font-bold uppercase tracking-widest text-zinc-500">
                                        <span>{(breakdown.elapsed / 3600000).toFixed(2)}h totali</span>
                                        <span>{(breakdown.paidElapsed / 3600000).toFixed(2)}h pagate</span>
                                        {nightHours > 0 && <span>{nightHours.toFixed(2)}h notte</span>}
                                        {breakdown.mealVoucher > 0 && <span>Buono EUR {breakdown.mealVoucher.toFixed(2)}</span>}
                                      </div>
                                    </div>
                                    <div className={`text-sm font-black ${getAmountTextClasses(totalWithVoucher)}`}>
                                      EUR {totalWithVoucher.toFixed(2)}
                                    </div>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      )}
                    </div>
                  </section>
                </div>
              )}
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
